<svg viewBox="0 0 640 400" role="img" aria-labelledby="gcTitle gcDesc" class="viz-gc">
  <title id="gcTitle">GitClear：重構程式碼佔比下滑，複製貼上程式碼佔比上升</title>
  <desc id="gcDesc">重構／搬移的程式碼從 2020 年的 24.1% 掉到 2024 年的 9.5%；複製貼上的程式碼從 8.3% 升到 12.3%，2024 年是複製貼上首度超過重構的一年。</desc>
  <style>
    .viz-gc{
      --ink:#211F1A; --ink-2:#6B675C; --ink-3:#98937F; --hair:#E3DED2; --surface:#FFFFFF;
      --s1:#177A5B; --s2:#4661C2; --grid:#E7E2D5; --axis:#C9C3B2;
    }
    @media (prefers-color-scheme: dark){
      :root:where(:not([data-theme="light"])) .viz-gc{
        --ink:#EDEBE3; --ink-2:#A5A99F; --ink-3:#7C8078; --hair:#2A2E2A; --surface:#1C1F1C;
        --s1:#2FA079; --s2:#6B7FE0; --grid:#262A26; --axis:#3A3F3A;
      }
    }
    :root[data-theme="dark"] .viz-gc{
      --ink:#EDEBE3; --ink-2:#A5A99F; --ink-3:#7C8078; --hair:#2A2E2A; --surface:#1C1F1C;
      --s1:#2FA079; --s2:#6B7FE0; --grid:#262A26; --axis:#3A3F3A;
    }
    .viz-gc text{font-family:"Noto Sans TC","PingFang TC",system-ui,-apple-system,sans-serif}
    .viz-gc .ax{fill:var(--ink-3); font-size:12.5px}
    .viz-gc .axn{fill:var(--ink-3); font-size:12px; font-variant-numeric:tabular-nums}
    .viz-gc .val{fill:var(--ink); font-size:13.5px; font-weight:700; font-variant-numeric:tabular-nums}
    .viz-gc .val2{fill:var(--ink-2); font-size:12.5px}
    .viz-gc .legend-text{fill:var(--ink-2); font-size:12.5px}
    .viz-gc .gridline{stroke:var(--grid); stroke-width:1}
    .viz-gc .baseline{stroke:var(--axis); stroke-width:1}
    .viz-gc .yeargrid{stroke:var(--grid); stroke-width:1; stroke-dasharray:2,3}
  </style>

  <!-- legend -->
  <g>
    <rect x="60" y="21" width="12" height="12" rx="3" fill="var(--s1)"/>
    <text x="78" y="31" class="legend-text">重構／搬移的程式碼</text>
    <rect x="260" y="21" width="12" height="12" rx="3" fill="var(--s2)"/>
    <text x="278" y="31" class="legend-text">複製貼上的程式碼</text>
  </g>

  <!-- horizontal gridlines + y labels: 0%, 10%, 20% -->
  <line x1="100" y1="300" x2="560" y2="300" class="baseline"/>
  <text x="90" y="304" text-anchor="end" class="axn">0%</text>
  <line x1="100" y1="214.3" x2="560" y2="214.3" class="gridline"/>
  <text x="90" y="218.3" text-anchor="end" class="axn">10%</text>
  <line x1="100" y1="128.6" x2="560" y2="128.6" class="gridline"/>
  <text x="90" y="132.6" text-anchor="end" class="axn">20%</text>

  <!-- year gridlines -->
  <line x1="140" y1="60" x2="140" y2="300" class="yeargrid"/>
  <line x1="520" y1="60" x2="520" y2="300" class="yeargrid"/>

  <!-- moved / refactored line: 24.1% (2020) -> 9.5% (2024) -->
  <g>
    <title>重構／搬移的程式碼：2020 年 24.1% → 2024 年 9.5%</title>
    <line x1="140" y1="93.4" x2="520" y2="218.6" stroke="var(--s1)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="140" cy="93.4" r="5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>
    <circle cx="520" cy="218.6" r="5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>
    <text x="128" y="80" text-anchor="end" class="val">24.1%</text>
    <text x="532" y="228" text-anchor="start" class="val">9.5%</text>
  </g>

  <!-- copy-pasted line: 8.3% (2020) -> 12.3% (2024) -->
  <g>
    <title>複製貼上的程式碼：2020 年 8.3% → 2024 年 12.3%</title>
    <line x1="140" y1="228.9" x2="520" y2="194.6" stroke="var(--s2)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="140" cy="228.9" r="5" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/>
    <circle cx="520" cy="194.6" r="5" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/>
    <text x="128" y="246" text-anchor="end" class="val">8.3%</text>
    <text x="532" y="184" text-anchor="start" class="val">12.3%</text>
  </g>

  <!-- year labels -->
  <text x="140" y="330" text-anchor="middle" class="ax">2020</text>
  <text x="520" y="330" text-anchor="middle" class="ax">2024</text>

  <!-- crossover callout -->
  <text x="330" y="368" text-anchor="middle" class="val2">2024 年：複製貼上的程式碼首度超過重構的程式碼</text>
</svg>
